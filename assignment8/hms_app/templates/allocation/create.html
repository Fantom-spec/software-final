{% extends "base.html" %}

{% block title %}Create Allocation - HMS{% endblock %}

{% block content %}
<div class="page-head">
    <div><h2>Create Room Allocation</h2><p class="sub">Assign a student to a room with a free bed</p></div>
    <a href="{{ url_for('room_allocation.index') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Back to list</a>
</div>

<div class="card" style="max-width:820px">
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="student_id" class="form-label">Student <span class="text-danger">*</span></label>
                    <select class="form-select" id="student_id" name="student_id" required>
                        <option value="">Select student</option>
                        {% for student in students %}
                        <option value="{{ student.student_id }}">{{ student.user.name }} ({{ student.roll_no }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="room_id" class="form-label">Room <span class="text-danger">*</span></label>
                    <select class="form-select" id="room_id" name="room_id" required>
                        <option value="">{{ 'Select room' if rooms else 'No rooms available' }}</option>
                        {% for room in rooms %}
                        <option value="{{ room.room_id }}">{{ room.block.name }} - {{ room.room_number }} (Floor {{ room.floor }}, {{ room.capacity - room.occupied_beds }} of {{ room.capacity }} free)</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="start_date" class="form-label">Start date <span class="text-danger">*</span></label>
                    <input type="date" class="form-control" id="start_date" name="start_date" value="{{ today }}" required>
                </div>
                <div class="col-md-6">
                    <label for="end_date" class="form-label">End date <span class="text-muted">(optional)</span></label>
                    <input type="date" class="form-control" id="end_date" name="end_date" min="{{ today }}">
                </div>
            </div>
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Create allocation</button>
            <a href="{{ url_for('room_allocation.index') }}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// Keep end date on/after start date
var s = document.getElementById('start_date'), e = document.getElementById('end_date');
s.addEventListener('change', function () { e.min = s.value; if (e.value && e.value < s.value) e.value = s.value; });
e.min = s.value || e.min;
</script>
{% endblock %}
